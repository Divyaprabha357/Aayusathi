<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AAYUSATHI - Localhost Multi-Interface Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AAYUSATHI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AAYUSATHI - Multi-Portal Healthcare Hub</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #071722;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #ffffff;
      text-align: center;
      background: radial-gradient(circle at 50% 40%, #0f3244, #0a1f2d, #05121b);
    }
    .spinner {
      width: 52px;
      height: 52px;
      border: 3.5px solid rgba(0, 126, 138, 0.2);
      border-radius: 50%;
      border-top-color: #007e8a;
      border-right-color: #ff6b35;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-top: 24px;
    }
    .title-aayu { color: #ffffff; }
    .title-sathi { color: #007e8a; }
    .status-text {
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      margin-top: 8px;
      font-weight: 500;
    }
    .port-pill {
      margin-top: 14px;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-size: 12px;
      color: #00a86b;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="title"><span class="title-aayu">AAYU</span><span class="title-sathi">SATHI</span></div>
    <div class="status-text">Starting Localhost Healthcare Interfaces...</div>
    <div class="port-pill">Server: http://localhost:8080</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.transition = 'opacity 0.4s ease';
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
